
<!DOCTYPE html>

<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Boundary Keeper</title>
    </head>

    <body>
        <div id="main-screen">
            <div id="main-chat-div">
                <header class="panel-header">
                    <h2>Chat</h2>
                </header>

                <div id="chat-container">

                    <div class="chat-box" id="chat-box" aria-live="polite">
                        <div class="received-message chat-message">Hello! How can I assist you today?</div>
                    </div>

                </div>
                <div id="prompt-div">
                    <form id="prompt-form">
                        <input type="text" id="prompt-input" placeholder="Enter prompt..." autofocus="autofocus">
                        <input type="submit" value="Submit" id="submit-prompt">
                    </form>
                </div>
            </div>

            <div id="main-stats-div">
                <header class="panel-header">
                    <h2>Analysis</h2>
                </header>

                <div id="stats-container">

                    <section class="stat-card">
                        <h3 class="stat-label">Prompt type</h3>
                        <span class="badge badge-neutral" id="prompt-type">-</span>
                    </section>

                    <section class="stat-card">
                        <h3 class="stat-label">Response bounds</h3>
                        <span class="badge badge-neutral" id="bounds-verdict">-</span>
                    </section>

                </div>

            </div>       
        </div>
        <script src="./script.js"></script>
    </body>
</html>
