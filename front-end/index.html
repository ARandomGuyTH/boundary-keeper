
<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Boundary Keeper</title>
    </head>

    <body>
        <div id="main-screen">
            <div id="main-chat-div">
                <div id="chat-container">
                    <div class="chat-box" id="chat-box">
                        <div class="received-message chat-message">Hello! How can I assist you today?</div>
                    </div>
                </div>
                <div id="prompt-div">
                    <form id="prompt-form">
                        <input type="text" id="prompt-input" placeholder="Enter prompt...">
                        <input type="submit" value="Submit" id="submit-prompt">
                    </form>
                </div>
            </div>

            <div id="main-stats-div">
                <button type ="button" class="button1" id="button1">Classify</button>
                <div id="classification"></div>
            </div>       
        </div>
        <script src="./script.js"></script>
    </body>
</html>
