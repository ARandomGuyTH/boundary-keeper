
<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
        <title>Boundary Keeper</title>
    </head>

    <body>
        <div id="main-screen">
            <div id="main-chat-div">
                <div id="chat-container">
                    <div class="chat-box" id="chat-box">
                        <div class="received-message chat-message">Hello! How can I assist you today?</div>
                        <div class="sent-message chat-message">LOL</div>
                    </div>
                </div>
                <div id="prompt-div">
                    <form id="prompt-form">
                        <input type="text" id="prompt-input" placeholder="Enter prompt...">
                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>
            <div id="main-stats-div"></div>
        </div>
    </body>
</html>
